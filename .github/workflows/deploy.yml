name: Deploy

# Builds the single-origin production image (backend + built SPA + migrations bundle) and
# redeploys the Railway service. Fires on backend pushes, on the frontend repo's
# repository_dispatch ping (see DEPLOY.md for the frontend workflow), and manually.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/recipeapp

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Secrets are not directly usable in step `if:`s across all contexts; surface
      # presence as a job env so the Railway step is a clean no-op until DEPLOY.md's
      # provisioning has happened.
      HAS_RAILWAY: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Recipe_App_Front
          ref: master
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Redeploy Railway service
        if: env.HAS_RAILWAY == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE_ID" --yes
